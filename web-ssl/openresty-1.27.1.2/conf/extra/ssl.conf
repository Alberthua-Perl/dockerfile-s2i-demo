# HTTP 服务器：强制跳转至 HTTPS
server {
    listen 80;
    server_name www.labsec.example.com  labsec.example.com;

    # 301 永久重定向至 HTTPS
    return 301 http://$server_name$request_uri;
}

# HTTPS 服务器（支持 HTTP/1.0, HTTP/1.1, HTTP/2, HTTP/3 可选）
server {
    listen 443 ssl;
    http2 on;    # 在 server 块内单独启用
    #listen 443 ssl http2;    # 旧语法（从 Nginx 1.25.1+ 版本起废弃）
    # HTTP/3 支持（Nginx 1.25.0+ with QUIC）
    # listen 443 quic reuseport;

    server_name www.labsec.example.com  labsec.example.com;    # 域名的别名
	
    #ssl on;    # Nginx 1.15.0+ 已废弃，会导致警告或错误

    # ========== SSL/TLS 配置 ==========

    # SSL 证书配置
    ssl_certificate     /apps/nginx/key/server.crt;    # server certificate
    ssl_certificate_key /apps/nginx/key/server.key;    # server key

    # 客户端证书双向认证
    ssl_client_certificate /apps/nginx/key/CA-center.crt;    # client CA certificate
    ssl_verify_client on;
    ssl_verify_depth 2;

    # 协议版本（兼容性与安全性平衡）
    ssl_protocols  TLSv1.2 TLSv1.3;

    # 现代加密套件配置
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;    # TLS 1.3 建议关闭

    # SSL 会话缓存
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;    # 增强前向安全性

    # OCSP Stapling（性能优化）
    ssl_stapling off;
    ssl_stapling_verify off;
    ssl_trusted_certificate /apps/nginx/key/CA-center.crt;
    resolver 8.8.8.8 114.114.114.114 valid=300s;
    resolver_timeout 5s;

    # ========== 安全响应头 ==========

    # ✅ if 在 server 块中是允许的
    if ($request_method !~ ^(GET|HEAD|POST|OPTIONS)$ ) {
        return 405;
    }

    # HSTS（强制 HTTPS）
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # HTTP/3  Alt-Svc 头（如启用 HTTP/3）
    # add_header Alt-Svc 'h3=":443"; ma=86400' always;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';" always;

    # ========== 性能优化 ==========

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # 静态资源缓存
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, immutable";
    }
   
    # ========== 根目录配置 ==========

    location / {
        root  /apps/nginx/html/www;    # 绝对路径指定根目录
        index  index.html index.htm;

        # 启用目录索引（如需要）
        # autoindex on;
        
        # 尝试文件或目录，否则 404
        try_files $uri $uri/ =404;
    }

    # 隐藏 Nginx 版本号
    server_tokens off;

    # 加载状态页面（Lua 代码无需修改，OpenResty 完全兼容）
    include extra/status.conf;
}
