# /apps/nginx/conf/extra/status.conf

# SSL 状态监控页面
location /status.html {
    default_type text/html;
    
    content_by_lua_block {
        local vars = {
            cipher = ngx.var.ssl_cipher or "N/A",
            protocol = ngx.var.ssl_protocol or "N/A",
            client_verify = ngx.var.ssl_client_verify or "NONE",
            client_s_dn = ngx.var.ssl_client_s_dn or "N/A",
            client_i_dn = ngx.var.ssl_client_i_dn or "N/A",
            client_serial = ngx.var.ssl_client_serial or "N/A",
            server_name = ngx.var.server_name,
            remote_addr = ngx.var.remote_addr,
            user_agent = ngx.var.http_user_agent or "N/A",
            time = os.date("%Y-%m-%d %H:%M:%S")
        }
        
        -- 安全级别判断
        local function get_security_level(cipher)
            if cipher:match("ECDHE") and cipher:match("AES256") then
                return "high", "🟢 高安全"
            elseif cipher:match("ECDHE") then
                return "medium", "🟡 中等安全"
            else
                return "low", "🔴 低安全"
            end
        end
        
        local level, level_desc = get_security_level(vars.cipher)
        
        ngx.say([[
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>SSL Status - ]] .. vars.server_name .. [[</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; padding: 40px 20px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { color: white; text-align: center; margin-bottom: 30px; }
        .card { 
            background: white; border-radius: 16px; padding: 25px; 
            margin-bottom: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h2 { color: #333; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 3px solid #667eea; }
        table { width: 100%; border-collapse: collapse; }
        tr:not(:last-child) { border-bottom: 1px solid #eee; }
        td { padding: 15px 10px; }
        td:first-child { width: 35%; color: #666; font-weight: 600; }
        td:last-child { font-family: 'Courier New', monospace; word-break: break-all; }
        .badge { display: inline-block; padding: 6px 16px; border-radius: 20px; font-size: 0.9em; font-weight: 600; }
        .badge-success { background: #d4edda; color: #155724; }
        .badge-warning { background: #fff3cd; color: #856404; }
        .high { color: #28a745; font-weight: bold; }
        .medium { color: #ffc107; font-weight: bold; }
        .low { color: #dc3545; font-weight: bold; }
        .footer { text-align: center; color: rgba(255,255,255,0.8); margin-top: 30px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔒 SSL/TLS 连接状态监控</h1>
        
        <div class="card">
            <h2>📊 连接摘要</h2>
            <table>
                <tr>
                    <td>连接状态</td>
                    <td><span class="badge badge-success">✓ 已加密连接</span></td>
                </tr>
                <tr>
                    <td>安全级别</td>
                    <td class="]] .. level .. [[">]] .. level_desc .. [[</td>
                </tr>
                <tr>
                    <td>协议版本</td>
                    <td class="high">]] .. vars.protocol .. [[</td>
                </tr>
                <tr>
                    <td>当前时间</td>
                    <td>]] .. vars.time .. [[</td>
                </tr>
            </table>
        </div>

        <div class="card">
            <h2>🔐 加密套件详情</h2>
            <table>
                <tr><td>协商套件</td><td class="high">]] .. vars.cipher .. [[</td></tr>
                <tr><td>密钥交换</td><td>]] .. (vars.cipher:match("ECDHE") and "椭圆曲线 Diffie-Hellman（前向安全）" or "其他") .. [[</td></tr>
                <tr><td>认证算法</td><td>]] .. (vars.cipher:match("RSA") and "RSA" or vars.cipher:match("ECDSA") and "ECDSA" or "未知") .. [[</td></tr>
                <tr><td>对称加密</td><td>]] .. (vars.cipher:match("AES256") and "AES-256-GCM（256位）" or vars.cipher:match("AES128") and "AES-128-GCM（128位）" or "其他") .. [[</td></tr>
            </table>
        </div>

        <div class="card">
            <h2>👤 客户端状态</h2>
            <table>
                <tr><td>客户端 IP</td><td>]] .. vars.remote_addr .. [[</td></tr>
                <tr><td>用户代理</td><td>]] .. vars.user_agent .. [[</td></tr>
                <tr>
                    <td>证书验证</td>
                    <td><span class="badge ]] .. (vars.client_verify == "SUCCESS" and "badge-success" or "badge-warning") .. [[">]] .. vars.client_verify .. [[</span></td>
                </tr>
                <tr><td>证书主题 (DN)</td><td>]] .. vars.client_s_dn .. [[</td></tr>
                <tr><td>证书颁发者 (DN)</td><td>]] .. vars.client_i_dn .. [[</td></tr>
                <tr><td>证书序列号</td><td>]] .. vars.client_serial .. [[</td></tr>
            </table>
        </div>

        <div class="card">
            <h2>🖥️ 服务端状态</h2>
            <table>
                <tr><td>服务器名称</td><td>]] .. vars.server_name .. [[</td></tr>
                <tr><td>HTTPS 状态</td><td><span class="badge badge-success">on</span></td></tr>
                <tr><td>客户端验证</td><td><span class="badge badge-success">已启用（双向认证）</span></td></tr>
                <tr><td>证书链验证</td><td><span class="badge badge-success">✓ 完整</span></td></tr>
            </table>
        </div>
        
        <div class="footer">
            <p>Powered by Nginx + Lua</p>
        </div>
    </div>
</body>
</html>
        ]])
    }
}

# 可选：添加 JSON 接口
location /api/status {
    default_type application/json;
    
    content_by_lua_block {
        local cjson = require "cjson"
        
        local data = {
            ssl = {
                cipher = ngx.var.ssl_cipher,
                protocol = ngx.var.ssl_protocol,
                client_verify = ngx.var.ssl_client_verify
            },
            client = {
                ip = ngx.var.remote_addr,
                user_agent = ngx.var.http_user_agent,
                subject = ngx.var.ssl_client_s_dn
            },
            server = {
                name = ngx.var.server_name,
                time = os.date("%Y-%m-%dT%H:%M:%SZ")
            }
        }
        
        ngx.say(cjson.encode(data))
    }
}
