# ========== 全局配置 ==========

user nginx;
# 自动根据 CPU 核心数设置，或手动指定
worker_processes auto;
# worker_processes 4;  # 如需固定，取消注释

# 错误日志级别：debug/info/notice/warn/error/crit/alert/emerg
error_log /apps/nginx/logs/error.log warn;

# Nginx 进程 PID 文件
pid /apps/nginx/logs/nginx.pid;

# 工作进程打开文件数限制（需配合 ulimit -n）
worker_rlimit_nofile 65535;

# ========== 事件模块 ==========

events {
    # 使用 epoll（Linux 高性能网络模型）
    use epoll;
    
    # 每个工作进程的最大连接数
    worker_connections 4096;
    
    # 允许一个工作进程同时接受多个新连接
    multi_accept on;
}

# ========== HTTP 模块 ==========

http {
    # ========== 基础配置 ==========
    
    include mime.types;
    default_type application/octet-stream;
    
    # 字符集
    charset utf-8;
    
    # 服务器名称哈希表大小
    server_names_hash_bucket_size 128;
    server_names_hash_max_size 512;
    
    # 隐藏 Nginx 版本号（安全）
    server_tokens off;
    
    # ========== 日志配置 ==========
    
    # 自定义日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    '$request_time $upstream_response_time';
    
    log_format json '{"time":"$time_iso8601",'
                    '"remote_addr":"$remote_addr",'
                    '"remote_user":"$remote_user",'
                    '"request":"$request",'
                    '"status":$status,'
                    '"body_bytes_sent":$body_bytes_sent,'
                    '"request_time":$request_time,'
                    '"upstream_response_time":"$upstream_response_time",'
                    '"http_referer":"$http_referer",'
                    '"http_user_agent":"$http_user_agent"}';
    
    # 访问日志（生产环境可关闭或按需启用）
    access_log /apps/nginx/logs/access.log main;
    # access_log off;  # 高性能场景关闭
    
    # ========== 性能优化 ==========
    
    # 高效文件传输
    sendfile on;
    tcp_nopush on;      # 累积数据包后一次性发送
    tcp_nodelay on;     # 实时发送小数据包（与 nopush 配合）
    
    # 连接保持
    keepalive_timeout 65;
    keepalive_requests 1000;  # 单个连接最大请求数
    
    # 重置超时连接
    reset_timedout_connection on;
    
    # 客户端请求限制
    client_max_body_size 50m;          # 最大上传文件大小
    client_body_buffer_size 128k;      # 客户端请求体缓冲区
    client_header_buffer_size 4k;      # 请求头缓冲区
    large_client_header_buffers 4 8k;  # 大请求头缓冲区
    
    # 发送超时设置
    send_timeout 30s;
    
    # ========== Gzip 压缩 ==========
    
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;    # 压缩级别 1-9，6 是性能与压缩比平衡
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;  # 小于 256 字节不压缩
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/rss+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject
        image/svg+xml;
    
    # ========== 安全相关 ==========
    
    # 防止点击劫持
    add_header X-Frame-Options "SAMEORIGIN" always;
    
    # 防止 MIME 类型嗅探
    add_header X-Content-Type-Options "nosniff" always;
    
    # XSS 保护
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Referrer 策略
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # 连接限制（需 limit_req_zone 配合）
    # limit_conn_zone $binary_remote_addr zone=addr:10m;
    # limit_conn addr 100;
    
    # 请求频率限制（需 limit_req_zone 配合）
    # limit_req_zone $binary_remote_addr zone=one:10m rate=10r/s;
    # limit_req zone=one burst=20 nodelay;
    
    # ========== 代理优化（如使用反向代理） ==========
    
    # 代理连接参数
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    
    # 代理缓冲区
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
    proxy_busy_buffers_size 8k;
    
    # 代理临时文件
    proxy_temp_path /apps/nginx/temp/proxy;
    proxy_max_temp_file_size 1024m;
    
    # 代理头信息
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # ========== 包含其他配置 ==========
    
    # 虚拟主机配置
    include extra/ssl.conf;
    # include extra/*.conf;  # 如需加载多个配置文件
}
